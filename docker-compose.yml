services:
  web:
    # Built from the upstream source checkout, not from octoboxio/octobox on
    # Docker Hub (that image has not been rebuilt since 2026-01).
    build:
      context: ../octobox
    image: wedamija/octobox
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      PUMA_WORKER_KILLER_RAM: "1024"
      WEB_CONCURRENCY: "0"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  worker:
    image: wedamija/octobox
    command: bundle exec sidekiq -C config/sidekiq.yml
    env_file: .env
    environment:
      OCTOBOX_SIDEKIQ_SCHEDULE_ENABLED: "true"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: octobox
      POSTGRES_PASSWORD: octobox
      POSTGRES_DB: octobox
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
